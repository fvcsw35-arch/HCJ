<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorem Ipsum Generator</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">
        <div class="glow-effect"></div>

        <header class="app-header">
            <div class="brand-badge">
                <i class="fa-solid fa-paragraph"></i> Text Generator
            </div>
            <h1 class="app-title">Lorem Ipsum 생성기</h1>
            <p class="app-subtitle">슬라이더를 조절하여 필요한 분량만큼 더미 텍스트를 생성하세요.</p>
        </header>

        <!-- 컨트롤 영역 -->
        <section class="control-card">
            <div class="control-header">
                <label for="char-slider" class="control-label">목표 글자 수</label>
                <div class="length-badge">
                    <span id="char-count-display">150</span>자
                </div>
            </div>

            <div class="slider-wrapper">
                <span class="slider-bound">10</span>
                <input type="range" id="char-slider" min="10" max="5000" value="150" step="1">
                <span class="slider-bound">5000</span>
            </div>

            <!-- 빠른 선택 버튼 -->
            <div class="preset-buttons">
                <button type="button" class="btn-preset" data-value="50">50자</button>
                <button type="button" class="btn-preset" data-value="150">150자</button>
                <button type="button" class="btn-preset" data-value="500">500자</button>
                <button type="button" class="btn-preset" data-value="1000">1000자</button>
                <button type="button" class="btn-preset" data-value="3000">3000자</button>
            </div>
        </section>

        <!-- 결과 표시 영역 -->
        <section class="output-card">
            <div class="output-header">
                <span class="output-title">생성된 텍스트</span>
                <button type="button" id="btn-copy" class="btn-copy" title="클립보드에 복사">
                    <i class="fa-regular fa-copy"></i>
                    <span id="copy-text">복사하기</span>
                </button>
            </div>

            <div class="text-area-wrapper">
                <textarea id="output-text" readonly placeholder="텍스트가 생성됩니다..."></textarea>
            </div>

            <div class="output-footer">
                <span class="info-tag">공백 포함: <strong id="actual-char-count">150</strong>자</span>
                <span class="info-tag">단어 수: <strong id="actual-word-count">0</strong>개</span>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
